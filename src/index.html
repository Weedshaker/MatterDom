<!DOCTYPE html>
<html lang="en">
<!-- http://localhost:4200/src/index.html?room=MatterDOMie&websocket-url=wss%3A%2F%2Fheroku.decentral.ninja%2F%3Fkeep-alive%3D0 -->
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Matter Dom - Initial Test</title>
</head>
<body data-width="1600" data-height="1200">
  <c-event-driven-yjs no-blur>
    <c-objects-yjs>
      <c-matter>
        <c-ipfs></c-ipfs>
        <c-time></c-time>
        <b-rectangle x=150 y=0 width=50 height=50 self background="green"></b-rectangle>
        <b-rectangle x=250 y=0 width=50 height=50 background="red" uid="some-object-uid-999-888-567"></b-rectangle>
        <b-rectangle x=0 y=1150 width=1600 height=50 background=darkblue is-static=true cursor=normal></b-rectangle>
      </c-matter>
    </c-objects-yjs>
  </c-event-driven-yjs>
  <style>
    body {
      margin: 0;
      height: attr(data-height px, 800px);
      width: attr(data-width px, 600px);
    }
  </style>
  <script rel=preload type=module>
    Promise.all([
      // Helpers
      import('./es/components/controllers/Matter.js').then(module => ['c-matter', module.default]),
      import('./es/components/controllers/Time.js').then(module => ['c-time', module.default]),
      import('./es/components/bodies/Rectangle.js').then(module => ['b-rectangle', module.default]),
      import('./es/event-driven-web-components-yjs/src/es/EventDrivenYjs.js').then(module => ['c-event-driven-yjs', module.EventDrivenYjs()]),
      import('./es/components/controllers/BodiesYjs.js').then(module => ['c-objects-yjs', module.BodiesYjs()]),
    ]).then(elements => elements.forEach(element => {
      // don't define already existing customElements
      if (element && !customElements.get(element[0])) customElements.define(...element)
    }))
  </script>
</body>
</html>
